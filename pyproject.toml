[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpotato-sim"
version = "0.0.0"
description = "Simulation-centered robot operation and experiment platform"
requires-python = ">=3.11"
dependencies = [
    "fast-arm-core",
    "matplotlib>=3.11.0",
    "mujoco>=3.9.0",
    "websockets>=16.0",
]

[project.scripts]
xpotato-sim = "xpotato_sim.cli:main"
xpotato-sim-r7-g-e2e = "xpotato_sim.runtime.experiment.r7_g_e2e:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["xpotato_sim.plugins.robots.fast_arm.core*"]
namespaces = false

[tool.setuptools.package-data]
"xpotato_sim.plugins.environments.object_scene_environment" = ["resources/objects/*.json", "resources/scenes/*.json"]
"xpotato_sim.plugins.mappings.viewer_keyboard_gamepad_mapping" = [
    "resources/*.json",
]
"xpotato_sim.plugins.robots.fast_arm.adapter" = [
    "resources/mujoco/*.xml",
    "resources/*.json",
    "resources/fixtures/*.json",
]

[tool.uv.sources]
fast-arm-core = { workspace = true }

[tool.uv.workspace]
members = ["src/xpotato_sim/plugins/robots/fast_arm/core"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pytest>=8.4.0",
    "ruff>=0.16.10",
]

[tool.mypy]
python_version = "3.12"
files = [
    "src/xpotato_sim/runtime/contact/manifest.py",
    "src/xpotato_sim/runtime/contact/task_contract.py",
    "src/xpotato_sim/runtime/contact/log.py",
    "tests/typing/contact_decoders.py",
]
# 未採用のimport先も型解析するが、その内部診断は本段階のgateに含めない。
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# correctnessの限定導入。format、import削除、unsafe fixは含めない。
select = ["E9", "F63", "F7", "F82"]
